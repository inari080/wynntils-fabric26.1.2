pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // repositoriesMode.set(RepositoriesMode.PREFER_PROJECT_REPOS) を下のように修正
    //repositoriesMode.set(org.gradle.api.initialization.resolve.RepositoriesMode.PREFER_PROJECT_REPOS)
    repositories {
        mavenLocal()
        // Fabric の公式 Maven（fabric-loader 等）
        maven { url = "https://maven.fabricmc.net/" }
        // Sponge / Mixin の Maven
        maven { url = "https://repo.spongepowered.org/maven" }
        // modrinth / jitpack / central なども追加
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://jitpack.io" }
        mavenCentral()
    }
}

rootProject.name = "wynntils"

include("common")
include("fabric")
