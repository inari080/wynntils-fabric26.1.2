plugins {
    id "com.diffplug.spotless" version "${spotless_version}"
}

// On the release branches, this string will be automatically updated by the bots
// Do not change this in the main branch!
version = "4.2.6"

allprojects {
    apply plugin: "java"
    apply plugin: "com.diffplug.spotless"

    version = rootProject.version
    group = "com.wynntils"

    // リポジトリのロックや初期化遅れを防ぐため、ここで確実に正しいURLを定義します
    repositories {
        mavenCentral()
        maven { url "https://jitpack.io" }
        // Sponge（Mixin）の正しいMavenリポジトリURL
        maven { url "https://repo.spongepowered.org/maven" }
        // Fabricの正しいMavenリポジトリURL
        maven { url "https://maven.fabricmc.net/" }
    }

    // 既存の設定（UTF-8指定）と、Minecraft環境のクラスパス結合処理
    tasks.withType(JavaCompile).configureEach { task ->
        options.encoding = "UTF-8"

        // :common プロジェクトのコンパイル時に、:fabric のクラスパスを安全に結合
        // NOTE: merging fabric project's configurations into common's compile classpath
        // can create circular task/configuration dependencies when fabric depends on common.
        // This logic previously added fabric project's compile/runtime classpath into
        // common's compile task, which caused circular dependency issues. We remove
        // that merging to avoid circular task graph. If specific compile-only
        // artifacts from fabric are needed, declare them as compileOnly dependencies
        // in the common module instead.
    }

    java {
        toolchain {
            // Minecraft 26.1.x requires Java 25 as the minimum Gradle/compile JVM.
            languageVersion.set(JavaLanguageVersion.of(java_version))
        }
        withSourcesJar()
    }

    spotless {
        java {
            target("src/*/java/**/*.java")
            palantirJavaFormat()
            formatAnnotations()
            importOrder()
            removeUnusedImports()
            endWithNewline()
            trimTrailingWhitespace()
        }
    }
}
