### GENERAL PROJECT SETTINGS

mod_id = wynntils

# Source code version
# Minecraft 26.1.x requires Java 25 as the minimum Gradle JVM.
java_version=25

# Minecraft version
# 26.1.x is unobfuscated: there is no "mappings" dependency anymore (see fabric/build.gradle).
minecraft_version=26.1.2
fabric_minecraft_version_range=26.1.2

### MOD FRAMEWORK SETTINGS

# Fabric
# Check for latest recommended versions at https://fabricmc.net/develop/
# Loader version below is unchanged from the 1.21.11 build (0.18.4 is still current for 26.1.x per Fabric's blog).
fabric_loader_version=0.18.4
# TODO: verify this is still the latest 26.1.2 build at https://modrinth.com/mod/fabric-api/versions before building
fabric_version=0.155.2+26.1.2

### OTHER DEPENDENCIES

# MixinExtras
# Check for updates at https://github.com/LlamaLad7/MixinExtras/releases
mixinextras_version=0.5.1

# Shadow
# Check for latest at https://github.com/GradleUp/shadow/releases
shadow_version=9.3.0

# Hades / Antiope (pure-Java libraries, no Minecraft dependency -> no porting needed)
hades_version=0.6.3
antiope_version=0.2.3

# JUnit
junit_version=5.13.4

# ModMenu
# TODO: verify a build exists for 26.1.2 at https://modrinth.com/mod/modmenu/versions - if not, temporarily
# comment out the modmenu dependency + entrypoint in fabric/build.gradle and fabric.mod.json.
modmenu_version=17.0.1-beta.1

### DEVELOPMENT SUPPORT

# DevAuth
# TODO: verify a build exists for 26.1.2 - the artifact naming/classifier scheme may have changed
# for unobfuscated versions. If unavailable yet, remove the modRuntimeOnly DevAuth line in fabric/build.gradle.
devauth_version=1.2.2

# Spotless
spotless_version=8.4.0
spotless_palantir_version=2.90.0
spotless_gson_version=2.14.0

### TWEAKS AND SETTINGS

archives_base_name=wynntils

org.gradle.caching=true
org.gradle.configuration-cache=false

org.gradle.jvmargs=-Xmx4096M --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

org.gradle.logging.level=info
